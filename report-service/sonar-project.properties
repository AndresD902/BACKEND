# ──────────────────────────────────────────────────────────────────────────────
# SonarCloud configuration for report-service
#
# How to use:
#   1. Set SONAR_TOKEN in your environment (or CI secrets).
#   2. Run:  npx sonar-scanner  (or use the SonarCloud GitHub Action).
#
# Replace "your-org" with your actual SonarCloud organization key.
# ──────────────────────────────────────────────────────────────────────────────

sonar.organization=your-org
sonar.projectKey=your-org_report-service
sonar.projectName=Report Service
sonar.projectVersion=1.0.0

# ── Source & test paths ───────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=tests
sonar.language=ts

# ── Coverage (lcov generated by: npm run test:coverage) ──────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Files excluded from analysis entirely ────────────────────────────────────
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  migrations/**

# ── Files excluded from coverage metrics ─────────────────────────────────────
# These require real HTTP connections and are tested only with integration tests.
sonar.coverage.exclusions=\
  **/server.ts,\
  **/app.ts,\
  **/config/**,\
  **/clients/employeeClient.ts,\
  **/clients/contractClient.ts,\
  **/clients/vacationClient.ts,\
  **/repositories/**,\
  **/routes/**,\
  **/entities/**,\
  **/dtos/**,\
  **/shared/enums/**

# ── Duplication exclusions ────────────────────────────────────────────────────
sonar.cpd.exclusions=\
  **/entities/**,\
  **/dtos/**

# ── Test file pattern ─────────────────────────────────────────────────────────
sonar.test.inclusions=tests/**/*.test.ts
