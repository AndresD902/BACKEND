# ──────────────────────────────────────────────────────────────────────────────
# SonarCloud configuration for vacation-service
#
# How to use:
#   1. Set SONAR_TOKEN in your environment (or CI secrets).
#   2. Run:  npx sonar-scanner  (or use the SonarCloud GitHub Action).
#
# Replace "your-org" below with your actual SonarCloud organization key.
# The project key must be unique within your organization.
# ──────────────────────────────────────────────────────────────────────────────

sonar.organization=your-org
sonar.projectKey=your-org_vacation-service
sonar.projectName=Vacation Service
sonar.projectVersion=1.0.0

# ── Source & test paths ───────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=tests
sonar.language=ts

# ── Coverage (lcov generated by: npm run test:coverage) ──────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Files excluded from analysis entirely ────────────────────────────────────
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  migrations/**

# ── Files excluded from coverage metrics ─────────────────────────────────────
# These require a real DB or SMTP and are tested with integration tests only.
sonar.coverage.exclusions=\
  **/server.ts,\
  **/app.ts,\
  **/config/database.ts,\
  **/routes/**,\
  **/entities/**,\
  **/dtos/**,\
  **/shared/enums/**,\
  **/repositories/**

# ── Duplication exclusions ────────────────────────────────────────────────────
sonar.cpd.exclusions=\
  **/entities/**,\
  **/dtos/**

# ── Test file pattern ─────────────────────────────────────────────────────────
sonar.test.inclusions=tests/**/*.test.ts
